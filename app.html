<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omweg app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: a preview stand. One app, shown inside a phone or a browser window; the app adapts to its own width with container queries. */
:root{
  --bg:#F4F5F2; --paper:#FFFFFF; --ground:#EAECE7; --ink:#141614; --muted:#5A605A; --hair:#D6DAD3; --stand:#DDE0DA; --frame:#111;
  --red:#C8102E; --red-ink:#FFFFFF; --yellow:#F2BE00; --yellow-soft:#FDF1C4; --water:#B9D6EE; --water-ink:#2F6A9A;
  --ok:#1C7A3E; --mid:#9A6200; --bad:#C8102E;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
/* always dark, whatever the device setting */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
  --bg:#121412; --paper:#1A1D1A; --ground:#242824; --ink:#F0F2EE; --muted:#A4ABA3; --hair:#323832; --stand:#0B0C0B; --frame:#3C433C;
  --red:#E8364D; --yellow:#F5C928; --yellow-soft:#3B3212; --water:#23435C; --water-ink:#8CBCE3; --ok:#62CB8A; --mid:#F0BE4A; --bad:#FF6B7C; color-scheme:dark}
:root[data-theme="dark"]{
  --bg:#121412; --paper:#1A1D1A; --ground:#242824; --ink:#F0F2EE; --muted:#A4ABA3; --hair:#323832; --stand:#0B0C0B; --frame:#3C433C;
  --red:#E8364D; --yellow:#F5C928; --yellow-soft:#3B3212; --water:#23435C; --water-ink:#8CBCE3; --ok:#62CB8A; --mid:#F0BE4A; --bad:#FF6B7C; color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{min-height:100%;margin:0;background:var(--stand);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.15}
p{margin:0}
a{color:inherit}
.mk{display:inline-block;width:15px;height:11px;flex:none;background:linear-gradient(#fff 0 50%,var(--red) 50% 100%);outline:1.5px solid #141614;outline-offset:-1.5px;vertical-align:-1px}
.mk.y{background:var(--yellow)}
.label{font:700 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- preview stand ---------- */
.standbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-bottom:1px solid var(--hair)}
.standbar .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{font:700 14px var(--display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--muted)}
.back:hover{color:var(--red)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{font:700 14px var(--display);letter-spacing:.06em;text-transform:uppercase;border:0;background:var(--paper);color:var(--ink);padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stand{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.device{position:relative;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.device.phone{width:400px;max-width:100%;height:820px;flex:none;border:11px solid var(--frame);border-radius:42px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.device.phone::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:24px;border-radius:14px;background:var(--frame);z-index:5}
.device.phone .app{padding-top:34px}
body[data-dev="desk"]{height:100%}
body[data-dev="desk"] .stand{padding:0;align-items:stretch}
.device.desk{width:100%;height:100%}
@media (max-width:520px){
  .stand{padding:0}
  .device.phone{width:100%;height:calc(100dvh - 60px);border:0;border-radius:0;box-shadow:none}
  .device.phone::before{display:none}
  .device.phone .app{padding-top:0}
}

/* ---------- the app (adapts to its own width) ---------- */
.app{flex:1;min-height:0;display:flex;flex-direction:column;container-type:inline-size;container-name:app}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--paper);border-bottom:2px solid var(--ink)}
.logo{background:var(--red);color:var(--red-ink);font:800 22px/1 var(--display);letter-spacing:.04em;padding:6px 24px 4px 10px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);text-transform:uppercase}
.from{display:flex;align-items:center;gap:8px}
.from select{font:600 14px var(--body);color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;padding:3px 6px}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;padding:20px;align-items:start;max-width:1180px;margin:0 auto}
.col-r{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--paper);border:1px solid var(--hair);border-radius:4px}
.ask{padding:14px;display:flex;flex-direction:column;gap:10px}
.ask h1{font:800 26px/1.1 var(--body);letter-spacing:-.015em}
.askrow{display:flex;gap:8px}
.askrow input{flex:1;min-width:0;font:16px var(--body);color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:3px;padding:10px 12px}
.go{flex:none;font:800 17px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--red);color:var(--red-ink);border:0;padding:12px 32px 12px 14px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.exs{display:flex;flex-wrap:wrap;gap:6px}
.yourturn{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.yourturn label{font:800 14px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.yourturn span{font-size:14px;color:var(--muted)}
.exhint{font-size:13.5px;color:var(--muted);font-style:italic}

.ex{font:500 13.5px var(--body);background:var(--ground);border:1px solid transparent;color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer;text-align:left}
.ex:hover{border-color:var(--ink)}
.ex[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.heard{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);border-top:1px solid var(--hair);padding-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);background:var(--ground);color:var(--ink);border:0;border-radius:3px;padding:3px 4px 3px 9px;cursor:pointer}
.chip .x{display:grid;place-items:center;width:17px;height:17px;background:var(--paper);color:var(--muted);font-size:12px;border-radius:2px}
.prefs{display:flex;flex-direction:column;gap:10px}
.minisw{position:relative;display:flex;align-items:flex-start;gap:12px;background:var(--paper);border:1.5px solid var(--hair);border-radius:8px;padding:11px 13px;cursor:pointer;transition:border-color .2s}
.minisw:hover{border-color:var(--ink)}
.minisw input{position:absolute;opacity:0;width:1px;height:1px}
.sw-track{flex:none;width:54px;height:30px;border-radius:999px;border:2px solid var(--ink);background:var(--ground);position:relative;transition:background .25s}
.knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #141614;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.knob svg{width:100%;height:100%;display:block;fill:#141614;stroke:#141614;stroke-width:2.6;stroke-linecap:round}
.knob path{fill:none}
.minisw input:checked+.sw-track{background:var(--ok)}
.minisw input:checked+.sw-track .knob{transform:translateX(24px)}
.minisw input:checked+.sw-track .frown,.minisw input:not(:checked)+.sw-track .smile{display:none}
.minisw input:focus-visible+.sw-track{outline:3px solid var(--yellow);outline-offset:3px}
.minisw .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.minisw .txt b{font:800 16px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.minisw .txt small{font-size:13px;color:var(--muted)}
.eff{font-size:13px;line-height:1.4;margin-top:3px}
.eff:empty{display:none}
.eff .chgpair{display:inline-flex;align-items:center;gap:6px;background:var(--ground);border-radius:4px;padding:3px 8px;margin:3px 4px 0 0}
.eff .chgpair s{color:var(--muted)}
.eff .chgpair b{font:600 13px/1.3 var(--body)}
@media (prefers-reduced-motion:reduce){.knob,.minisw{transition:none}}
.day{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.pkg{padding:14px 16px;display:flex;flex-direction:column;gap:5px;border-left:6px solid var(--red)}
.pkg h2{font:700 24px/1.15 var(--body);letter-spacing:-.015em}
.pkg p{color:var(--muted);font-size:14.5px}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid var(--hair);margin-top:8px;padding-top:9px}
.sum div{display:flex;flex-direction:column;min-width:0}
.sum b{font:800 21px/1.1 var(--display)}
.sum span{font-size:12px;color:var(--muted)}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:54px 28px minmax(0,1fr);column-gap:10px}
.time{font:800 19px/1 var(--display);text-align:right;padding-top:13px}
.time small{display:block;font:600 12px var(--body);color:var(--muted);margin-top:4px}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;transform:translateX(-50%);background:repeating-linear-gradient(var(--red) 0 10px,transparent 10px 15px)}
.stop.last .rail::before{bottom:calc(100% - 20px)}
.blaze{position:relative;z-index:1;width:26px;height:24px;margin-top:11px;display:grid;place-items:center;font:800 14px var(--display);background:linear-gradient(#fff 0 50%,var(--red) 50% 100%);outline:2px solid #141614;outline-offset:-2px;color:#141614}
.blaze span{background:#fff;padding:0 3px;line-height:1.1}
.blaze.y{background:var(--yellow)}.blaze.y span{background:transparent}
.card{margin:5px 0;padding:11px 13px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card.local{border-color:var(--yellow);box-shadow:inset 0 0 0 1px var(--yellow)}
.card.chg{outline:2px dashed var(--ink);outline-offset:2px}
.card h3{font:700 18px/1.25 var(--body);letter-spacing:-.01em}
.sub{font-size:13.5px;color:var(--muted)}
.reason{font-size:14.5px;display:flex;gap:9px;align-items:baseline}
.blazemark{flex:none;align-self:center;width:14px;height:6px;border-radius:1px;background:currentColor;box-shadow:0 -3px 0 #fff}
.ok{color:var(--ok)}.near{color:var(--mid)}.off{color:var(--bad)}
.more{display:none;flex-direction:column;gap:7px;border-top:1px solid var(--hair);padding-top:7px}
.card.open .more{display:flex}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.why li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;align-items:baseline}
.why b{text-align:center}
.note{font-size:13px;color:var(--muted)}
.tip{font-size:13px;color:var(--muted);border-left:3px solid var(--yellow);padding-left:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font:700 13.5px var(--display);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:4px 10px;cursor:pointer;text-decoration:none;white-space:nowrap;border-radius:2px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.link{border-color:transparent;padding-inline:4px;text-decoration:underline;text-underline-offset:3px}
.btn.link:hover{background:none;color:var(--red)}
.leg{grid-column:3;font-size:12.5px;color:var(--muted);font-style:italic;padding:2px 0}
.alts{display:flex;flex-direction:column;gap:8px}
.altrow{display:flex;flex-wrap:wrap;gap:8px}
.pkgalt{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-width:2px;border-radius:6px;text-align:left}
.pkgalt .ti{color:var(--red);flex:none}.pkgalt:hover .ti{color:inherit}
.pkg-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.pkg-top h2{display:flex;align-items:center;gap:9px}.pkg-top .ti{width:22px;height:22px;color:var(--red);flex:none}
.match{font:700 11.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1.5px solid var(--hair);border-radius:999px;padding:6px 9px 5px;white-space:nowrap}
.alt{font:700 14px var(--display);letter-spacing:.04em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);padding:5px 10px;cursor:pointer;color:var(--ink);border-radius:2px}
.alt:hover{background:var(--ink);color:var(--bg)}
.mapbox{padding:8px}
.mapbox svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;flex:none;display:inline-block;border-radius:2px}
.impact{padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.cmpgrid{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;align-items:baseline}
.cmpgrid em{font:700 11px var(--display);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}
.cmpgrid .k{font-size:14px;color:var(--muted);border-top:1px solid var(--hair);padding-top:6px}
.cmpgrid b,.cmpgrid span:not(.k){font:800 19px/1 var(--display);text-align:right;border-top:1px solid var(--hair);padding-top:6px}
.cmpgrid span:not(.k){font-weight:600;color:var(--muted)}
.cmpgrid b.win{color:var(--ok)}
.mlist{display:flex;flex-direction:column;gap:6px;font-size:14px}
.mlist div{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center}
.acts{justify-content:space-between}
.minor{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.lnk{background:none;border:0;padding:4px 6px;font:600 13.5px var(--body);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px;border-radius:2px}
.lnk:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.thin{border:1.5px solid #FF8A3D;background:color-mix(in srgb,#FF8A3D 12%,transparent);border-radius:3px;padding:9px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.dayend{display:flex;flex-direction:column;gap:14px;border:2px solid var(--ok);border-radius:8px;padding:16px 18px;background:color-mix(in srgb,var(--ok) 9%,var(--paper))}
.de-head{display:flex;align-items:center;gap:14px}
.de-head p{margin:2px 0 0;font-size:14.5px;color:var(--muted)}
.dayend h3,.dayend h4{margin:0;font:800 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.de-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.de-stats div{background:var(--paper);border:1px solid var(--hair);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.de-stats b{font:800 30px/1 var(--display);color:var(--ok)}
.de-stats span{font-size:13px;line-height:1.3;color:var(--muted)}
.de-again{align-self:flex-start}
.seal{width:58px;height:52px;display:grid;place-items:center;font:800 28px/1 var(--display);color:#141614;background:linear-gradient(#fff 0 50%,var(--ok) 50% 100%);outline:3px solid #141614;outline-offset:-3px;transform:rotate(-4deg)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#device .confetti{position:absolute}
.confetti i{position:absolute;top:-24px;width:14px;height:10px;outline:1.5px solid #141614;outline-offset:-1.5px}
@media (prefers-reduced-motion:no-preference){
  .dayend.fresh-end .seal{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
  .dayend.fresh-end .de-stats div{animation:rise .35s ease-out both}
  .dayend.fresh-end .de-stats div:nth-child(2){animation-delay:.08s}.dayend.fresh-end .de-stats div:nth-child(3){animation-delay:.16s}
  @keyframes stamp{from{transform:scale(1.8) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .confetti i{animation:fall var(--dur) cubic-bezier(.25,.6,.4,1) var(--delay) forwards}
  @keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),780px) rotate(var(--rot));opacity:0}}
}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.card{position:relative}
.donemark{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#0b1a10;display:grid;place-items:center;font:800 17px/1 var(--body)}
.ico{display:inline-block;vertical-align:-2px;flex:none}
.lpill{display:inline-block;vertical-align:3px;margin-left:8px;font:800 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;background:var(--yellow);color:#141614;padding:4px 7px 3px;border-radius:3px}
.swapbtn{position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;gap:6px;font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1.5px solid var(--hair);border-radius:3px;padding:4px 9px;cursor:pointer}
.swapbtn:hover{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.swapbtn .ic{font-size:15px;line-height:1}
.card h3,.card h4{padding-right:96px}
.btn.route{background:transparent;border-color:var(--red);color:var(--red);display:inline-flex;align-items:center;gap:6px}
.btn.route.first{border-color:#3D8BFF;color:#3D8BFF}
.btn.route.first:hover,.btn.route.first.next{background:#3D8BFF;border-color:#3D8BFF;color:#fff}
.btn.route.first.next{box-shadow:0 0 0 3px color-mix(in srgb,#3D8BFF 35%,transparent);animation:none}
.btn.route.last{border-color:#A77BFF;color:#A77BFF}
.btn.route.last:hover,.btn.route.last.next{background:#A77BFF;border-color:#A77BFF;color:#fff}
.btn.route.last.next{box-shadow:0 0 0 3px color-mix(in srgb,#A77BFF 35%,transparent);animation:none}
.btn.route:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn.route.next{background:var(--red);color:#fff;font-size:15.5px;padding:7px 16px;box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 35%,transparent)}
.here{flex:none;display:inline-flex;align-items:center;gap:7px;font:800 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--ok);color:#0b1a10;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;transition:transform .15s}
.here:hover{transform:translateY(-1px)}
.onway{display:inline-flex;align-items:center;gap:8px;font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:#FF8A3D}
.pulse{flex:none;width:9px;height:9px;border-radius:50%;background:#FF8A3D}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,138,61,.55)}70%{box-shadow:0 0 0 8px rgba(255,138,61,0)}100%{box-shadow:0 0 0 0 rgba(255,138,61,0)}}}
.again{font-size:13px;color:var(--muted);text-underline-offset:3px}
.again:hover{color:var(--ink)}
.visited{font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}
.card.t-go{border-color:#FF8A3D;box-shadow:inset 0 0 0 1px #FF8A3D}
.card.t-done{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.card.t-done h3,.card.t-done h4{color:var(--muted)}
.blaze.t-go{background:#FF8A3D!important}.blaze.t-done{background:var(--ok)!important}
.blaze.t-go span,.blaze.t-done span{background:transparent}
.progress{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:14px;color:var(--muted)}
.progress b{color:var(--ink)}
.progress button{font:700 12.5px var(--display);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
@media (prefers-reduced-motion:no-preference){.btn.route.next{animation:nudge 2.4s ease-in-out infinite}@keyframes nudge{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 35%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 15%,transparent)}}}
.tabs{display:none}

/* narrow app (phone): one column, map behind a tab */
@container app (max-width:720px){
  .cols{grid-template-columns:minmax(0,1fr);padding:12px;gap:12px}
  .col-r{position:static}
  .cols[data-tab="plan"] .col-r{display:none}
  .cols[data-tab="map"] .col-l{display:none}
  .tabs{display:grid}
  .ask h1{font-size:21px}
  .askrow{flex-direction:column}
  .go{align-self:flex-start}
  .exs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .exs::-webkit-scrollbar{display:none}
  .ex{flex:none}
  .sum b{font-size:18px}
  .stop{grid-template-columns:46px 28px minmax(0,1fr);column-gap:8px}
  .time{font-size:17px}
}
.tabs{grid-template-columns:1fr 1fr;background:var(--paper);border-top:1px solid var(--hair);padding:2px 10px 8px}
.tab{background:none;border:0;border-top:3px solid transparent;font:700 14px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-top-color:var(--red)}
@media (prefers-reduced-motion:no-preference){.fresh{animation:fresh .45s ease-out both}@keyframes fresh{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}}

@media (max-width:520px){.seg[aria-label="Preview"]{display:none}}
@media (max-width:620px){.swapbtn{font-size:0;gap:0;padding:7px 8px}.swapbtn svg{width:16px;height:16px}}
</style>

const MAAS=[[50.745,5.700],[50.790,5.706],[50.820,5.708],[50.840,5.700],[50.849,5.6975],[50.860,5.697],[50.880,5.690],[50.930,5.730],[50.980,5.765],[51.040,5.790],[51.100,5.810],[51.160,5.830],[51.190,5.940],[51.200,5.985],[51.260,6.020],[51.330,6.120],[51.370,6.175],[51.420,6.150]];
function mapSVG(m,W){
  const st=m.plan.stops,b=TOWNS[baseOf(m)];

  let la0=Math.min(...pts.map(p=>p[0])),la1=Math.max(...pts.map(p=>p[0])),lo0=Math.min(...pts.map(p=>p[1])),lo1=Math.max(...pts.map(p=>p[1]));
  const pLa=Math.max(.0035,(la1-la0)*.22),pLo=Math.max(.008,(lo1-lo0)*.42);la0-=pLa;la1+=pLa;lo0-=pLo;lo1+=pLo;

  if(h/w>1.05){const e=(h/1.05-w)/kx/2;lo0-=e;lo1+=e;w=(lo1-lo0)*kx}

  // context: the Maas and nearby towns
  const river=MAAS.map(p=>f(p[0],p[1]).map(v=>v.toFixed(1)).join(",")).join(" ");
  s+=`<polyline points="${river}" fill="none" stroke="var(--water)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`;
  const inView=MAAS.map(p=>f(p[0],p[1])).filter(([x,y])=>x>30&&x<W-30&&y>30&&y<H-30);
  for(const t in TOWNS){if(t===baseOf(m))continue;const [x,y]=f(...TOWNS[t]);if(x>20&&x<W-20&&y>20&&y<H-20)s+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="11" font-weight="700" letter-spacing="1.2" fill="var(--muted)" text-anchor="middle" ${halo}>${t.toUpperCase()}</text>`}

  const boxes=nodes.map(([x,y])=>[x-13,y-12,x+13,y+12]);
  const hit=a=>a[0]<2||a[2]>W-2||a[1]<2||a[3]>H-2||boxes.some(o=>a[0]<o[2]&&a[2]>o[0]&&a[1]<o[3]&&a[3]>o[1]);

  if(st.length>1){const [fx,fy]=nodes[st.length];s+=`<rect x="${(fx-17).toFixed(1)}" y="${(fy-16).toFixed(1)}" width="34" height="32" rx="3" fill="none" stroke="#A77BFF" stroke-width="3.5"><title>Finish</title></rect>`}
  st.forEach((x,i)=>{const [px,py]=nodes[i+1],ts=tripSt(i),y=x.p.local||ts;
    s+=`<g><title>${i+1}. ${esc(x.p.name)}${ts==="done"?" (visited)":ts==="go"?" (on the way)":""}</title><rect x="${(px-12).toFixed(1)}" y="${(py-11).toFixed(1)}" width="24" height="22" fill="${ts==="done"?"var(--ok)":ts==="go"?"#FF8A3D":x.p.local?"var(--yellow)":"var(--red)"}" stroke="#141614" stroke-width="2"/>${y?"":`<rect x="${(px-11).toFixed(1)}" y="${(py-10).toFixed(1)}" width="22" height="10" fill="#fff"/>`}<text x="${px.toFixed(1)}" y="${(py+5).toFixed(1)}" font-size="14" font-weight="800" text-anchor="middle" fill="#141614" font-family="Barlow Condensed, Arial Narrow, sans-serif">${i+1}</text></g>`});
  const labels=[[bx,by,"Start",`${baseOf(m)} centre`,"#3D8BFF"]].concat(st.map((x,i)=>{const last=st.length>1&&i===st.length-1,nm=x.p.name.length>(last?18:24)?x.p.name.slice(0,last?17:23)+"…":x.p.name;return [nodes[i+1][0],nodes[i+1][1],last?"Finish "+hm(x.start):hm(x.start),nm,last?"#A77BFF":null]}));

}

// Kept per position in the day; a stop keeps its status as long as the same place stays at that position (e.g. after a swap later in the day).
function tripSync(m){
  const ids=m.plan.stops.map(s=>s.p.id),old=state.trip,st={};
  if(old&&old.ids.join()===ids.join())return;
  if(old)ids.forEach((id,i)=>{if(old.ids[i]===id&&old.st[i])st[i]=old.st[i]});
  state.trip={ids,st};
}
const tripSt=i=>(state.trip&&state.trip.st[i])||"";
function tripNext(m){for(let i=0;i<m.plan.stops.length;i++)if(tripSt(i)!=="done")return i;return -1}
function tripGo(i){for(const k in state.trip.st)if(state.trip.st[k]==="go")delete state.trip.st[k];state.trip.st[i]="go"}
function tripDone(i){state.trip.st[i]="done"}
const tripCount=()=>state.trip?Object.values(state.trip.st).filter(v=>v==="done").length:0;
/* ---------- day impact: what the visited stops did for Limburg ---------- */
const quietVisit=s=>s.p.crowd>=3&&!s.peak; // a popular place visited outside its rush hour
function tripImpact(m){
  const b={stops:0,local:0,quiet:0};
  m.plan.stops.forEach((s,i)=>{if(tripSt(i)==="done"){b.stops++;if(s.p.local)b.local++;if(quietVisit(s))b.quiet++}});
  b.complete=m.plan.stops.length>0&&b.stops===m.plan.stops.length;return b;
}

/* ---------- what a switch changed ---------- */
const SWITCH_NAME={crowd:"Plan around crowds",local:"Prefer local businesses"};
function switchFlip(which,on){const prev=state.cur.plan.stops.map(s=>s.p);state[which]=on;resolve();state.chg={which,on,prev}}
function switchNote(){
  const c=state.chg;if(!c)return "";
  const next=state.cur.plan.stops.map(s=>s.p),nIds=new Set(next.map(p=>p.id)),pIds=new Set(c.prev.map(p=>p.id));
  const gone=c.prev.filter(p=>!nIds.has(p.id)),added=next.filter(p=>!pIds.has(p.id));
  if(!gone.length&&!added.length){
    const why=c.which==="local"
      ?(c.on?"the day already used the closest local businesses.":"the closest places for this day happen to be local businesses anyway.")
      :(c.on?"the chosen places were already quiet at these times.":"the chosen places are quiet at these times anyway.");
    return `Same day – ${why}`;
  }
  const pairs=gone.map((p,k)=>`<span class="chgpair"><s>${esc(p.name)}</s>${ICON.right}<b>${added[k]?esc(added[k].name):"dropped"}</b></span>`).concat(added.slice(gone.length).map(p=>`<span class="chgpair">added <b>${esc(p.name)}</b></span>`));
  return pairs.join("");
}

}
function renderAll(fresh,keep){if(!keep)state.chg=null;resolve();renderHeard();renderDay(fresh);renderMap()}
function setTab(t){state.tab=t;document.getElementById("cols").dataset.tab=t;document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));document.getElementById("main").scrollTop=0}

document.getElementById("exs").innerHTML=EXAMPLES.map((t,i)=>`<button type="button" class="ex" data-ex="${i}" aria-pressed="false" title="${esc(t)}">${esc(EX_LABELS[i])}</button>`).join("");
document.getElementById("base").innerHTML=Object.keys(TOWNS).map(t=>`<option${t===state.base?" selected":""}>${t}</option>`).join("");
document.getElementById("askform").addEventListener("submit",e=>{e.preventDefault();const v=document.getElementById("askinput").value.trim();if(v)ask(v)});
document.getElementById("exs").addEventListener("click",e=>{const b=e.target.closest(".ex");if(b)ask(EXAMPLES[+b.dataset.ex])});
document.getElementById("heard").addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;const m=state.cur,k=c.dataset.k;
  if(k.startsWith("avoid:")){m.q.avoid=m.q.avoid.filter(x=>x!==k.slice(6));if(!m.q.avoid.length)delete m.q.avoid}
  else if(k.startsWith("mix:")){delete m.q.mix[k.slice(4)];const tot=Object.values(m.q.mix).reduce((a,b)=>a+b,0);if(tot>0){for(const x in m.q.mix)m.q.mix[x]/=tot}else delete m.q.mix}else delete m.q[k];
  m.swaps={};m.themeLock=null;renderAll(true)});

/* ---------- re-render without moving the page ---------- */
// The day list is rebuilt on every click; on phones the page briefly gets shorter and jumps to the top.
// Lock the list's height during the rebuild and put every scroll position back where it was.
function stay(fn){
  const d=document.getElementById("day"),inner=document.getElementById("main"),y=window.scrollY,yi=inner?inner.scrollTop:0;
  if(d)d.style.minHeight=d.offsetHeight+"px";
  fn();
  if(inner)inner.scrollTop=yi;
  window.scrollTo(0,y);
  requestAnimationFrame(()=>{if(d)d.style.minHeight=""});
}
document.getElementById("day").addEventListener("click",e=>{
  if(e.target.closest("[data-again]")){const inp=document.getElementById("askinput");inp.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>inp.focus({preventScroll:true}),400);return}
  const bb=e.target.closest("[data-base]");if(bb){state.base=bb.dataset.base;document.getElementById("base").value=state.base;state.cur.swaps={};renderAll(true);return}
  const go=e.target.closest("[data-go]");if(go){const i=+go.dataset.go;setTimeout(()=>stay(()=>{tripGo(i);renderDay(false);renderMap()}),0);return}
  const here=e.target.closest("[data-here]");if(here){let ended=false;stay(()=>{tripDone(+here.dataset.here);const pt=tripImpact(state.cur);if(pt.complete&&!state.trip.celebrated){state.trip.celebrated=true;state.trip.fresh=true;renderDay(false);renderMap();state.trip.fresh=false;celebrate();ended=true}else{renderDay(false);renderMap()}});if(ended)setTimeout(()=>{const de=document.querySelector(".dayend");if(de)de.scrollIntoView({behavior:"smooth",block:"center"})},60);return}
  if(e.target.closest("[data-trip-reset]")){state.trip.st={};state.trip.celebrated=false;stay(()=>{renderDay(false);renderMap()});return}
  const o=e.target.closest("[data-open]");if(o){const i=+o.dataset.open;state.open=state.open===i?-1:i;stay(()=>renderDay(false));return}
  const sw=e.target.closest("[data-swap]");if(sw){const m=state.cur,si=+sw.dataset.swap,s=m.plan.stops.find(x=>x.i===si);if(!s)return;
    const cur=s.ranked.findIndex(r=>r.p.id===s.p.id);const nxt=s.ranked.slice(cur+1).find(r=>!m.plan.stops.some(x=>x.p.id===r.p.id))||s.ranked.find(r=>!m.plan.stops.some(x=>x.p.id===r.p.id));
    if(nxt){m.swaps[si]=nxt.p.id;Object.keys(m.swaps).forEach(k=>{if(+k>si)delete m.swaps[k]})}state.open=m.plan.stops.indexOf(s);stay(()=>renderAll(false));return}
  const th=e.target.closest("[data-theme]");if(th){const m=state.cur;m.themeLock=th.dataset.theme||null;m.swaps={};state.open=-1;renderAll(true);document.getElementById("main").scrollTop=0}
});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
document.querySelectorAll("button[data-dev]").forEach(b=>b.addEventListener("click",()=>{const d=b.dataset.dev;document.getElementById("device").className="device "+d;document.body.dataset.dev=d;document.querySelectorAll("button[data-dev]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));try{localStorage.setItem("omweg-dev",d)}catch(e){}}));
try{const d=localStorage.getItem("omweg-dev");if(d==="desk")document.querySelector('[data-dev="desk"]').click()}catch(e){}
document.getElementById("base").addEventListener("change",e=>{state.base=e.target.value;state.cur.swaps={};renderAll(true)});
document.getElementById("crowd").addEventListener("change",e=>{stay(()=>{switchFlip("crowd",e.target.checked);renderAll(false,true)})});
document.getElementById("local").addEventListener("change",e=>{stay(()=>{switchFlip("local",e.target.checked);renderAll(false,true)})});
ask(EXAMPLES[0],true);
})();
</script>
